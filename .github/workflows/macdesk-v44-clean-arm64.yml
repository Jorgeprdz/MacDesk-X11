name: MacDesk V4.4 CLEAN ARM64 Bookworm GPU

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PREFIX: /opt/macdesk-v44
  WORK: /tmp/macdesk-v44-build
  S25_REF_COMMIT: 35519672cf2e252e87e78a77afd2c3284c8200d4
  WAYLAND_VERSION: 1.23.1
  WAYLAND_PROTOCOLS_VERSION: 1.39
  GLSLANG_VERSION: 15.1.0
  WLR_VERSION: 0.19.3
  LABWC_VERSION: 0.9.7

jobs:
  build-bookworm-arm64:
    name: build-bookworm-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    container:
      image: debian:12

    steps:
      - name: Checkout MacDesk
        uses: actions/checkout@v4

      - name: 00 - Bootstrap and diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$WORK" "$PREFIX" "$GITHUB_WORKSPACE/out" "$GITHUB_WORKSPACE/.ci-logs"
          mkdir -p "$WORK" "$PREFIX" "$GITHUB_WORKSPACE/out" "$GITHUB_WORKSPACE/.ci-logs"
          uname -a | tee "$GITHUB_WORKSPACE/.ci-logs/uname.txt"
          dpkg --print-architecture | tee "$GITHUB_WORKSPACE/.ci-logs/arch.txt"
          test "$(dpkg --print-architecture)" = arm64

      - name: 01 - Install Bookworm build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'deb http://deb.debian.org/debian bookworm-backports main' > /etc/apt/sources.list.d/bookworm-backports.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential git ca-certificates curl pkg-config \
            python3 python3-pip python3-mako python3-yaml python3-packaging python3-ply \
            bison flex gettext ninja-build cmake zstd \
            libffi-dev libexpat1-dev libxml2-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev libvulkan-dev \
            libxkbcommon-dev libpixman-1-dev libinput-dev libseat-dev libudev-dev \
            libliftoff-dev libxcb1-dev libx11-dev libx11-xcb-dev \
            libxcb-composite0-dev libxcb-render0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libxcb-dri3-dev libxcb-present-dev libxcb-randr0-dev libxcb-xinput-dev \
            libxcb-icccm4-dev libxcb-ewmh-dev libxcb-res0-dev libxcb-util-dev \
            libxcb-image0-dev libxcb-render-util0-dev libxcb-cursor-dev \
            libxshmfence-dev libxcb-keysyms1-dev \
            liblcms2-dev libpng-dev librsvg2-dev libcairo2-dev libpango1.0-dev libglib2.0-dev \
            libelf-dev libunwind-dev zlib1g-dev libzstd-dev hwdata scdoc xwayland
          DEBIAN_FRONTEND=noninteractive apt-get install -y -t bookworm-backports \
            libdisplay-info-dev libxcb-errors-dev
          python3 -m pip install --break-system-packages --no-cache-dir --upgrade \
            'meson>=1.4' 'ninja>=1.11' 'cmake>=3.27'
          hash -r
          {
            echo "ARCH=$(dpkg --print-architecture)"
            echo "CMAKE=$(cmake --version | head -1)"
            echo "MESON=$(meson --version)"
            echo "NINJA=$(ninja --version)"
          } | tee "$GITHUB_WORKSPACE/.ci-logs/toolchain.txt"

      - name: 02 - Verify pinned S25 reference
        shell: bash
        run: |
          set -Eeuo pipefail
          git init "$WORK/s25ref"
          git -C "$WORK/s25ref" remote add origin https://github.com/Azkali/phosh-termux-gpu.git
          git -C "$WORK/s25ref" fetch --depth 1 origin "$S25_REF_COMMIT"
          git -C "$WORK/s25ref" checkout --detach FETCH_HEAD
          ACTUAL="$(git -C "$WORK/s25ref" rev-parse HEAD)"
          test "$ACTUAL" = "$S25_REF_COMMIT"
          test -s "$WORK/s25ref/fedora/apply_wlr_patches.py"
          test -s "$WORK/s25ref/fedora/3-build-turnip.sh"
          python3 -m py_compile "$WORK/s25ref/fedora/apply_wlr_patches.py"
          echo "S25_REF=$ACTUAL" | tee "$GITHUB_WORKSPACE/.ci-logs/s25-reference.txt"

      - name: 03 - Build Wayland
        shell: bash
        run: |
          set -Eeuo pipefail
          export PKG_CONFIG_PATH="$PREFIX/lib/aarch64-linux-gnu/pkgconfig:$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig"
          export LD_LIBRARY_PATH="$PREFIX/lib/aarch64-linux-gnu:$PREFIX/lib"
          git clone --depth 1 --branch "$WAYLAND_VERSION" \
            https://gitlab.freedesktop.org/wayland/wayland.git "$WORK/wayland"
          meson setup "$WORK/wayland/build" "$WORK/wayland" \
            --prefix="$PREFIX" --buildtype=release \
            -Ddocumentation=false -Ddtd_validation=false -Dtests=false
          meson compile -C "$WORK/wayland/build"
          meson install -C "$WORK/wayland/build"
          test -x "$PREFIX/bin/wayland-scanner"
          echo "WAYLAND=$WAYLAND_VERSION" | tee "$GITHUB_WORKSPACE/.ci-logs/wayland.txt"

      - name: 04 - Build Wayland protocols
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$PREFIX/bin:$PATH"
          export PKG_CONFIG_PATH="$PREFIX/lib/aarch64-linux-gnu/pkgconfig:$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig"
          export LD_LIBRARY_PATH="$PREFIX/lib/aarch64-linux-gnu:$PREFIX/lib"
          git clone --depth 1 --branch "$WAYLAND_PROTOCOLS_VERSION" \
            https://gitlab.freedesktop.org/wayland/wayland-protocols.git "$WORK/wayland-protocols"
          meson setup "$WORK/wayland-protocols/build" "$WORK/wayland-protocols" \
            --prefix="$PREFIX" --buildtype=release -Dtests=false
          meson compile -C "$WORK/wayland-protocols/build"
          meson install -C "$WORK/wayland-protocols/build"
          echo "WAYLAND_PROTOCOLS=$WAYLAND_PROTOCOLS_VERSION" | tee "$GITHUB_WORKSPACE/.ci-logs/wayland-protocols.txt"

      - name: 05 - Build glslang
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --depth 1 --branch "$GLSLANG_VERSION" \
            https://github.com/KhronosGroup/glslang.git "$WORK/glslang"
          cmake -S "$WORK/glslang" -B "$WORK/glslang/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DBUILD_EXTERNAL=OFF \
            -DENABLE_OPT=OFF \
            -DENABLE_SPVREMAPPER=OFF \
            -DGLSLANG_TESTS=OFF \
            -DGLSLANG_ENABLE_INSTALL=ON \
            -DENABLE_GLSLANG_BINARIES=ON
          cmake --build "$WORK/glslang/build" --parallel "$(nproc)"
          cmake --install "$WORK/glslang/build"
          test -x "$PREFIX/bin/glslangValidator"
          "$PREFIX/bin/glslangValidator" --version | tee "$GITHUB_WORKSPACE/.ci-logs/glslang.txt"

      - name: 06 - Clone and validate Mesa source
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --depth 1 https://gitlab.freedesktop.org/mesa/mesa.git "$WORK/mesa"
          MESA_COMMIT="$(git -C "$WORK/mesa" rev-parse HEAD)"
          echo "MESA_COMMIT=$MESA_COMMIT" | tee "$GITHUB_WORKSPACE/.ci-logs/mesa-source.txt"
          test -s "$WORK/mesa/src/freedreno/vulkan/tu_knl_kgsl.cc"
          grep -R -n -m 8 -E '44050001|A830|a830' "$WORK/mesa/src/freedreno" \
            | tee "$GITHUB_WORKSPACE/.ci-logs/mesa-a830-evidence.txt"
          test -s "$GITHUB_WORKSPACE/.ci-logs/mesa-a830-evidence.txt"

      - name: 07 - Apply minimal KGSL Turnip patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$WORK/mesa/src/freedreno/vulkan/tu_knl_kgsl.cc" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          guard = """   if (instance->vk.enabled_extensions.KHR_display) {
                return vk_errorf(instance, VK_ERROR_INITIALIZATION_FAILED,
                                 "I can't KHR_display");
             }"""
          if guard in s:
              p.write_text(s.replace(guard, '   /* KGSL: ignore KHR_display instead of failing. */', 1))
              print("PATCH_KHR_DISPLAY=APPLIED")
          else:
              print("PATCH_KHR_DISPLAY=NOT_NEEDED")
          PY
          git -C "$WORK/mesa" diff --check
          git -C "$WORK/mesa" diff -- src/freedreno/vulkan/tu_knl_kgsl.cc \
            | tee "$GITHUB_WORKSPACE/.ci-logs/mesa-kgsl.patch"

      - name: 08 - Configure Mesa Turnip
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$PREFIX/bin:/usr/local/bin:$PATH"
          export PKG_CONFIG_PATH="$PREFIX/lib/aarch64-linux-gnu/pkgconfig:$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig"
          export LD_LIBRARY_PATH="$PREFIX/lib/aarch64-linux-gnu:$PREFIX/lib"
          meson setup "$WORK/mesa/build" "$WORK/mesa" \
            --prefix="$PREFIX" --buildtype=release \
            -Dvulkan-drivers=freedreno \
            -Dgallium-drivers= \
            -Dfreedreno-kmds=kgsl,msm \
            -Dplatforms=x11,wayland \
            -Dglx=disabled -Degl=disabled -Dgbm=disabled \
            -Dopengl=false -Dllvm=disabled -Dvideo-codecs= -Dvulkan-layers=

      - name: 09 - Build and install Mesa Turnip
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$PREFIX/bin:/usr/local/bin:$PATH"
          export PKG_CONFIG_PATH="$PREFIX/lib/aarch64-linux-gnu/pkgconfig:$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig"
          export LD_LIBRARY_PATH="$PREFIX/lib/aarch64-linux-gnu:$PREFIX/lib"
          meson compile -C "$WORK/mesa/build"
          meson install -C "$WORK/mesa/build"
          ICD="$PREFIX/share/vulkan/icd.d/freedreno_icd.aarch64.json"
          test -s "$ICD"
          cat "$ICD" | tee "$GITHUB_WORKSPACE/.ci-logs/freedreno-icd.json"

      - name: 10 - Clone and patch wlroots 0.19.3
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /root/wlroots
          git clone --depth 1 --branch "$WLR_VERSION" \
            https://gitlab.freedesktop.org/wlroots/wlroots.git /root/wlroots
          BEFORE="$(git -C /root/wlroots rev-parse HEAD)"
          python3 "$WORK/s25ref/fedora/apply_wlr_patches.py" \
            | tee "$GITHUB_WORKSPACE/.ci-logs/wlroots-patch.txt"
          git -C /root/wlroots diff --check
          grep -q 'WLR_BUFFER_CAP_DATA_PTR' /root/wlroots/render/vulkan/renderer.c
          echo "WLROOTS=$WLR_VERSION SOURCE=$BEFORE" | tee "$GITHUB_WORKSPACE/.ci-logs/wlroots-source.txt"

      - name: 11 - Configure wlroots
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$PREFIX/bin:/usr/local/bin:$PATH"
          export PKG_CONFIG_PATH="$PREFIX/lib/aarch64-linux-gnu/pkgconfig:$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig"
          export LD_LIBRARY_PATH="$PREFIX/lib/aarch64-linux-gnu:$PREFIX/lib"
          meson setup /root/wlroots/build /root/wlroots \
            --prefix="$PREFIX" --buildtype=release \
            -Dbackends=drm,libinput,x11 \
            -Drenderers=gles2,vulkan \
            -Dxwayland=enabled \
            -Dexamples=false -Dwerror=false

      - name: 12 - Build and install wlroots
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$PREFIX/bin:/usr/local/bin:$PATH"
          export PKG_CONFIG_PATH="$PREFIX/lib/aarch64-linux-gnu/pkgconfig:$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig"
          export LD_LIBRARY_PATH="$PREFIX/lib/aarch64-linux-gnu:$PREFIX/lib"
          meson compile -C /root/wlroots/build
          meson install -C /root/wlroots/build
          find "$PREFIX/lib" -name 'libwlroots-0.19.so*' -print \
            | tee "$GITHUB_WORKSPACE/.ci-logs/wlroots-installed.txt"
          test -s "$GITHUB_WORKSPACE/.ci-logs/wlroots-installed.txt"

      - name: 13 - Build and install Labwc
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$PREFIX/bin:/usr/local/bin:$PATH"
          export PKG_CONFIG_PATH="$PREFIX/lib/aarch64-linux-gnu/pkgconfig:$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig"
          export LD_LIBRARY_PATH="$PREFIX/lib/aarch64-linux-gnu:$PREFIX/lib"
          git clone --depth 1 --branch "$LABWC_VERSION" \
            https://github.com/labwc/labwc.git "$WORK/labwc"
          meson setup "$WORK/labwc/build" "$WORK/labwc" \
            --prefix="$PREFIX" --buildtype=release \
            -Dxwayland=enabled -Dicon=disabled -Dtest=disabled
          meson compile -C "$WORK/labwc/build"
          meson install -C "$WORK/labwc/build"
          test -x "$PREFIX/bin/labwc"

      - name: 14 - Package MacDesk V4.4 GPU stack
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$GITHUB_WORKSPACE/out"
          META="$PREFIX/share/macdesk-v44"
          mkdir -p "$META"
          cp -a "$GITHUB_WORKSPACE/.ci-logs/." "$META/"
          {
            echo "S25_REF_COMMIT=$S25_REF_COMMIT"
            echo "WAYLAND_VERSION=$WAYLAND_VERSION"
            echo "WAYLAND_PROTOCOLS_VERSION=$WAYLAND_PROTOCOLS_VERSION"
            echo "GLSLANG_VERSION=$GLSLANG_VERSION"
            echo "WLR_VERSION=$WLR_VERSION"
            echo "LABWC_VERSION=$LABWC_VERSION"
            cat "$GITHUB_WORKSPACE/.ci-logs/mesa-source.txt"
          } > "$META/build-manifest.txt"
          tar -I 'zstd -T0 -19' -C "$PREFIX" \
            -cf "$OUT/macdesk-v44-arm64-bookworm-gpu.tar.zst" .
          sha256sum "$OUT/macdesk-v44-arm64-bookworm-gpu.tar.zst" \
            | tee "$OUT/macdesk-v44-arm64-bookworm-gpu.tar.zst.sha256"
          ls -lh "$OUT"
          echo "V44_CLEAN_BUILD=PASS"

      - name: Upload V4.4 ARM64 GPU stack
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MacDesk-V4.4-CLEAN-ARM64-Bookworm-GPU
          path: |
            out/macdesk-v44-arm64-bookworm-gpu.tar.zst
            out/macdesk-v44-arm64-bookworm-gpu.tar.zst.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload V4.4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MacDesk-V4.4-CLEAN-Build-Logs
          path: .ci-logs/
          if-no-files-found: warn
          retention-days: 14
