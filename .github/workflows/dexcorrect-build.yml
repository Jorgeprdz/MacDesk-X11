name: DeX Correct APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DeX Correct v0.3
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android API 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: tools/DeXCorrect
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            DeXCorrect-v0.3.apk

          echo
          echo "===== APK ====="
          ls -lh DeXCorrect-v0.3.apk

          echo
          echo "===== SHA256 ====="
          sha256sum DeXCorrect-v0.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: DeXCorrect-v0.3
          path: tools/DeXCorrect/DeXCorrect-v0.3.apk
          if-no-files-found: error
          retention-days: 30
