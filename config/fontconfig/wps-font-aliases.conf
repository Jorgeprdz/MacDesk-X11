<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias binding="same"><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Times New Roman</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Calibri</family><prefer><family>Carlito</family><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Cambria</family><prefer><family>Caladea</family><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Symbol</family><prefer><family>Noto Sans Symbols 2</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Wingdings</family><prefer><family>Noto Sans Symbols 2</family><family>DejaVu Sans</family></prefer></alias>
</fontconfig>
